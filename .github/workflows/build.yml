name: Build and Push Frontend Docker Image

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout repo
      - uses: actions/checkout@v4

      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      # Step 3: Install dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Build the project (validation step)
      - name: Build project
        env:
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
          VITE_S3_BASE_URL: ${{ secrets.VITE_S3_BASE_URL }}
        run: npm run build

      # Step 5: Set up Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 6: Log in to Docker Hub (only if build succeeded)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_PASSWORD }}

      # Step 7: Build and push Docker image (build already validated)
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            rickylyxon/ecom_clover_front:latest
            rickylyxon/ecom_clover_front:${{ github.sha }}
          build-args: |
            VITE_BACKEND_URL=${{ secrets.VITE_BACKEND_URL }}
            VITE_S3_BASE_URL=${{ secrets.VITE_S3_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Trigger infrastructure deployment
      - name: Trigger deployment
        if: github.ref == 'refs/heads/main'
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          repository: rickylaikhuram/clover_infrastructure
          event-type: service-updated
          client-payload: |
            {
              "service": "frontend",
              "tag": "${{ github.sha }}",
              "repository": "${{ github.repository }}"
            }
          continue-on-error: true